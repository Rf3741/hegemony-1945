[package]
name = "guerra_fria"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cliente gráfico em Bevy + bevy_egui para o jogo de grande estratégia Guerra Fria (1945)"

[dependencies]
bevy = { workspace = true, features = ["wav", "vorbis"] }
bevy_sprite_render = { version = "0.20.0", features = ["bevy_text"] }
bevy_egui.workspace = true
image.workspace = true
bandeiras_resolver.workspace = true
ron.workspace = true
flate2.workspace = true
serde.workspace = true
simulacao.workspace = true
gf_mapa.workspace = true
sim_economia.workspace = true
visual_mapa.workspace = true
ui_refinada.workspace = true
eventos.workspace = true
ia_paises.workspace = true
sim_diplomacia.workspace = true
egui_plot.workspace = true
sim_politica.workspace = true
sim_tecnologia.workspace = true
personagens.workspace = true
sim_guerra.workspace = true

[features]
# Perfil de desempenho: grava o tempo de cada sistema em trace-*.json (formato Chrome tracing).
# Uso: cargo build -p guerra_fria --profile jogo --features perfil (target separado).
perfil = ["bevy/trace_chrome"]

[workspace]
resolver = "3"
members = [
    "crates/simulacao",
    "crates/gerador_mapa",
    "crates/guerra_fria",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Guerra Fria Dev"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
shapefile = { version = "0.9", features = ["encoding_rs"] }
bevy = "0.20.0"
bevy_egui = "0.43.1"
simulacao = { path = "crates/simulacao" }

# Otimiza dependências no modo debug para manter 60 FPS no Bevy sem atrasar recompilações incrementais
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

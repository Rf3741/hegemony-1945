[workspace]
resolver = "3"
members = [
    "crates/simulacao",
    "crates/gf_mapa",
    "crates/gerador_mapa",
    "crates/guerra_fria",
    "crates/sim_economia",
    "crates/sim_politica",
    "crates/sim_territorio",
    "crates/sim_guerra",
    "crates/bandeiras_resolver",
    "crates/ui_refinada",
    "crates/visual_mapa",
    "crates/eventos",
    "crates/sim_diplomacia",
    "crates/sim_tecnologia",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Guerra Fria Dev"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
shapefile = { version = "0.9", features = ["encoding_rs"] }
bevy = "0.20.0"
bevy_egui = "0.43.1"
egui = "0.36.2"
egui_plot = "0.37"
simulacao = { path = "crates/simulacao" }
gf_mapa = { path = "crates/gf_mapa" }
sim_economia = { path = "crates/sim_economia" }
sim_politica = { path = "crates/sim_politica" }
sim_territorio = { path = "crates/sim_territorio" }
sim_guerra = { path = "crates/sim_guerra" }
bandeiras_resolver = { path = "crates/bandeiras_resolver" }
ui_refinada = { path = "crates/ui_refinada" }
visual_mapa = { path = "crates/visual_mapa" }
eventos = { path = "crates/eventos" }
sim_diplomacia = { path = "crates/sim_diplomacia" }
sim_tecnologia = { path = "crates/sim_tecnologia" }

# Otimiza dependências no modo debug para manter 60 FPS no Bevy sem atrasar recompilações incrementais
[profile.dev]
opt-level = 1
# Só números de linha: linkar com debuginfo completo levava ~10 min e ~2 GB por binário.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Release: otimizacao maxima para distribuicao
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# CI: testes rapidos com limite de tempo
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false

[profile.ci.package."*"]
opt-level = 0
